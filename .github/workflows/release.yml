name: Release VoiceTypeMini

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, for example 0.2.0"
        required: true
        type: string
      build_number:
        description: "Incrementing CFBundleVersion, for example 2"
        required: true
        type: string
      prerelease:
        description: "Create the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" ]]; then
            echo "DEVELOPER_ID_APPLICATION_CERT_BASE64 and DEVELOPER_ID_APPLICATION_CERT_PASSWORD are required." >&2
            exit 1
          fi
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-temporary-release-keychain}"
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          python3 - <<'PY' > "$CERTIFICATE_PATH"
          import base64
          import os
          import sys
          sys.stdout.buffer.write(base64.b64decode(os.environ["CERTIFICATE_BASE64"]))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build release artifacts
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          TAG: v${{ inputs.version }}
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: Scripts/release-build.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--target "$GITHUB_SHA" --title "VoiceTypeMini $VERSION" --notes-file "dist/release-notes-$VERSION.md")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "v$VERSION" "dist/VoiceTypeMini-$VERSION.zip" "${args[@]}"

      - name: Commit appcast and version bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cp dist/appcast.xml appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppConfig/Info.plist appcast.xml Package.resolved
          if git diff --cached --quiet; then
            echo "No appcast or version changes to commit."
          else
            git commit -m "Publish VoiceTypeMini $VERSION appcast"
            git push origin HEAD:main
          fi
